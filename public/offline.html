<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#004D25">
  <title>เป๋ายา - ไม่มีอินเทอร์เน็ต</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #333; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    h1 { color: #2D7A4C; font-size: 22px; margin: 20px 0 8px; }
    p { color: #666; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    button { background: #388E3C; color: #fff; border: 0; padding: 12px 28px; border-radius: 999px; font-size: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>ไม่ได้เชื่อมต่ออินเทอร์เน็ต</h1>
    <p>เป๋ายาต้องใช้อินเทอร์เน็ตเพื่อโหลดข้อมูลของคุณ<br>กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่</p>
    <button onclick="location.reload()">ลองใหม่</button>
  </div>
</body>
</html>
