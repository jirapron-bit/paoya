<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>เป๋ายา (PAOYA)</title>
  <meta name="description" content="ผู้ช่วยดูแลเรื่องยา: ค้นหาข้อมูลยา บันทึกยาประจำ นัดหมาย ประวัติแพ้ยา และสแกนฉลากยา">

  <!-- ติดตั้งเป็นแอป (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#004D25">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- iPhone / iPad -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="เป๋ายา">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <!-- แปลง JSX ในเบราว์เซอร์ (แก้ไฟล์ .jsx แล้วรีเฟรชได้เลย ไม่ต้อง build) -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-white">

  <!-- กรอบแอป: เต็มจอบนมือถือ/iPad -->
  <div id="root" class="app-frame bg-white overflow-hidden flex flex-col relative">
    <div class="flex-1 flex flex-col items-center justify-center text-gray-400 text-sm gap-3">
      <img src="icons/icon-192.png" alt="" width="72" height="72" style="border-radius:50%">
      กำลังโหลด...
    </div>
  </div>

  <!-- ลำดับไฟล์สำคัญ: ไฟล์ด้านบนประกาศของที่ไฟล์ด้านล่างใช้ -->
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script type="text/babel" data-presets="react" src="js/ui.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/auth.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/home.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/medicine.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/mymeds.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/scan.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/pharmacy.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/settings.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/chat.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/reminders.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/app.jsx"></script>

  <script>
    // ลงทะเบียน service worker (ต้องเปิดผ่าน https หรือ localhost)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (err) { console.warn('SW:', err); });
      });
    }
    // เก็บสัญญาณ "ติดตั้งแอป" ของ Android/Chrome ไว้ให้ปุ่มในหน้าตั้งค่าใช้
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__paoyaInstallPrompt = e;
      window.dispatchEvent(new Event('paoya:installable'));
    });
  </script>
</body>
</html>
